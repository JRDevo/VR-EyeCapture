; OpenXR-EyeCapture -- config.ini
; Read when an OpenXR game starts (restart the game after editing).
; Location: next to eye_capture.dll, or %APPDATA%\OpenXR-EyeCapture\config.ini (that one wins if it exists).
; Format: key = value. Lines starting with ; or # are comments.

[capture]
; 1 (default) = the layer is DORMANT (pure pass-through, nothing started) unless EyeCaptureTray.exe is running when the
; game creates its VR session. Start the tray app BEFORE launching the game. 0 = always armed, no tray needed (hotkey only).
; Test override: environment variable XR_EYE_CAPTURE_REQUIRE_TRAY=0|1.
require_tray = 1

; 0 (default) = left eye in the left half, right eye in the right half (standard SBS, what YouTube expects).
; 1 = swapped. Only use this if a player shows the depth inside-out and has no "swap eyes" option of its own.
swap_eyes = 0

; Start / stop recording. Modifiers must match exactly: Ctrl, Shift, Alt + a key
; (F1..F24, A..Z, 0..9, Numpad0..9, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock ...), or none.
; Default Ctrl+Shift+F10 (plain Ctrl+F10 is the DLAA injector's snapshot key in ETS2 / ATS).
hotkey = ScrollLock

; Where the MP4 files go. Empty = the "captures" folder next to eye_capture.dll.
; File name: <game exe>_<yyyyMMdd_HHmmss>_SBS.mp4
output_dir =

; hevc (default; needed above 4096 px wide, e.g. Quest 3 at high resolution) or h264.
codec = hevc

; Video bitrate in Mbit/s. 0 = default (120 for hevc, 80 for h264).
bitrate_mbps = 0

; Fallback frame rate when it cannot be measured from the game's frame timing.
fps = 90

; 0 = record every frame the game submits. Otherwise drop frames above this rate (e.g. 60).
max_fps = 0

; 0 = native resolution, exactly what the headset receives. Otherwise scale the side-by-side frame down to this width.
max_width = 0

; gamma: auto (from the swapchain format), srgb or linear. Only change it if colours look washed out / too dark.
gamma = auto

[head_smoothing]
; 1 (default) = re-project both eyes to ONE common symmetric view (same field of view, parallel cameras), which is what
; 3D side-by-side players (YouTube VR, 3D TVs) expect. Headsets render each eye with an asymmetric field of view (the
; outer side is wider); played back raw on a flat 3D player, far objects land at different places in the two eyes and
; the eyes cannot fuse the picture (eye strain). The output keeps the part both eyes see (e.g. +-40 x +-45 degrees of a
; -50/+40 headset) at the game's pixel density, so it is a little narrower than the raw eye image.
; 0 = record the raw eye images exactly as the headset gets them (only useful for re-processing them yourself).
symmetric_fov = 1
; Head-motion smoothing ("stop head shaking"): the recording is re-projected onto a smoothed head orientation, the way
; a headset's timewarp re-projects a frame, so viewers do not get every small shake of your head. Rotation only.
; Applied to the recording only -- what you see in the headset is unchanged.
; 0 (default) = off: nothing extra runs, the output is exactly as without this feature.
; 0.1 .. 1 = strength. Filter time constant: 0.1 = 0.05 s, 0.3 = 0.11 s, 0.5 = 0.23 s, 0.6 = 0.33 s, 0.7 = 0.48 s,
; 0.8 = 0.70 s, 1.0 = 1.5 s  (= 0.05 s x 30 ^ ((value - 0.1) / 0.9)). Recommended 0.5 .. 0.7.
head_smoothing = 0.6
; Deliberate turns: once the smoothed view is this many degrees behind your head it catches up (full speed at twice
; this angle) and keeps following quickly until it is close again, so looking around is not lagged.
head_follow_deg = 12
; 1 = keep the horizon level (removes head roll / tilt from the recording). With edge_guard = 1 the horizon is only
; held level as far as the rendered image reaches (a few degrees); edge_guard = 0 holds it fully but shows black
; corners when you tilt your head.
roll_lock = 0
; The recording shows this fraction of the game's field of view (tan of each fov angle x this value), 0.5 .. 1.
; The trimmed border is the room the correction needs; 0.9 (default) leaves about 3 degrees on every side.
; Only used when head_smoothing > 0. Smaller = more room (stronger smoothing without hitting the edges), less view.
; With symmetric_fov = 1 it scales the common symmetric view.
output_fov_scale = 0.9
; 1 (default) = never show black edges: when a correction would need pixels the game did not render, the view follows
; the head just enough to stay inside the image. 0 = always apply the full correction (black edges can appear).
edge_guard = 1

[indicator]
; In-headset recording indicator: a small dot in the corner of your view, visible in the headset only (never in the
; video). Amber = starting / finishing, red pulsing = recording, green (1.5 s) = saved, red X (2 s) = failed; hidden
; otherwise. Direct3D 11 games (ETS2 / ATS) only for now. Read when the game starts its VR session.
vr_indicator = 1
; Position of the dot's centre in metres, relative to your head: x = right, y = up, z = forward (negative = in front).
indicator_x = 0.22
indicator_y = -0.16
indicator_z = -0.8
; Size of the dot in metres (0.02 m at 0.8 m is about 1.4 degrees) and its maximum opacity (0..1).
indicator_size = 0.02
indicator_opacity = 1.0

[audio]
; Records what plays on the audio device (WASAPI loopback) as AAC.
audio_enabled = 1
; Part of the playback device name, e.g. Virtual Desktop Audio. Empty = the default playback device.
audio_device =

[post_processing]
; Done by EyeCaptureTray.exe (not the game) after each recording finishes, while the tray is running. The tray re-reads
; these for every job, so no restart is needed.
; 1 (default) = remux the MP4 (no re-encode) to <same name>.mkv with the Matroska stereo_mode=left_right tag. YouTube only
; reliably recognises the 3D tag in the MKV, so upload the .mkv. Needs ffmpeg (winget install Gyan.FFmpeg.Essentials).
post_mkv = 1
; 0 (default) = delete the MP4 once the MKV exists and is > 90% of its size (and the flat file, if requested, was made).
; 1 = keep both. If the conversion fails the MP4 is never deleted.
keep_mp4 = 0
; 1 = also write <same name>_FLAT.mp4: a normal 2D video for viewers without a headset (left eye, 16:9 centre crop, scaled to
; 3840 wide, NVENC HEVC 40 Mbit/s or x264 crf 18 if there is no NVENC). Slower than the MKV step. Default 0 (off).
post_flat = 0
; Full path of ffmpeg.exe. Empty (default) = ffmpeg on PATH, else the WinGet packages folder
; (%LOCALAPPDATA%\Microsoft\WinGet\Packages), else an ffmpeg\ffmpeg.exe folder next to the tray app.
ffmpeg_path =

[debug]
; error | warn | info | debug. Log: logs\eye_capture.log next to the DLL, copy in the output folder.
log_level = info
