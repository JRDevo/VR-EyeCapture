; OpenXR-EyeCapture -- config.ini
; Read when an OpenXR game starts, and read again at the start of every recording (keyboard / mouse hotkeys, require_tray
; and the [indicator] keys need a game restart; the rest applies to the next recording). The tray app has a Settings window for it.
; Location: next to eye_capture.dll, or %APPDATA%\OpenXR-EyeCapture\config.ini (that one wins if it exists).
; Format: key = value. Lines starting with ; or # are comments.

[capture]
; 1 (default) = the layer is DORMANT (pure pass-through, nothing started) unless EyeCaptureTray.exe is running when the
; game creates its VR session. Start the tray app BEFORE launching the game. 0 = always armed, no tray needed (hotkey only).
; Test override: environment variable XR_EYE_CAPTURE_REQUIRE_TRAY=0|1.
require_tray = 1

; 0 (default) = left eye in the left half, right eye in the right half (standard SBS, what YouTube expects).
; 1 = swapped. Only use this if a player shows the depth inside-out and has no "swap eyes" option of its own.
swap_eyes = 0

; 1 (default) = also record the game's and other mods' overlay panels (OpenXR quad / cylinder / equirect / cube layers: menus, the DLAA
; injector's VR panel and fps box), placed and blended the way the headset shows them. 0 = record only the game's 3D view.
; The Virtual Desktop / Quest system menus are added by the headset itself and can never be recorded; our own red dot
; (the in-headset indicator) is never recorded either. Applies to the next recording.
record_overlays = 1

; Start / stop recording. One or more, separated by commas; any of them works. none = tray menu only.
;   Keys: Ctrl, Shift, Alt + a key (F1..F24, A..Z, 0..9, Numpad0..9, Insert, Delete, Home, End, PageUp, PageDown, Pause,
;   ScrollLock, CapsLock, MediaPlayPause, VolumeUp, Semicolon ..., any other key as Key0xNN). Modifiers must match exactly.
;   Mouse: MouseMiddle, MouseX1, MouseX2. Keys and mouse buttons are read when the game starts.
;   Xbox controller: Pad:A, Pad:Back+Start (hold both), Pad2:LB (2nd pad only).
;   Wheel / joystick: Joy:*:Button3 (any device), Joy:T300RS:Button5+Button6 (device name contains T300RS), POVUp/Down/Left/Right.
;   Controller and wheel buttons are read by the tray app and apply at once. EyeCaptureTray.exe --inputs prints their names.
;   Example: hotkey = ScrollLock, Pad:Back+Start
; Default Ctrl+Shift+F10 (plain Ctrl+F10 is the DLAA injector's snapshot key in ETS2 / ATS).
hotkey = ScrollLock

; Where the MP4 files go. Empty = the "captures" folder next to eye_capture.dll.
; File name: <game exe>_<yyyyMMdd_HHmmss>_SBS.mp4 (_VR180.mp4 / _VR360.mp4 + a .json sidecar in [dome] mode)
; The converted files (MKV, 8K, flat) are written next to the MP4, on the same drive. Nothing large goes to C: or %TEMP%.
; Low-space guard: a recording or a conversion does not start with less than 10 GB free on that drive, and a recording
; is stopped (and saved) when the drive drops below 2 GB free.
output_dir =

; hevc (default; needed above 4096 px wide, e.g. Quest 3 at high resolution), h264, or av1.
; av1 = hardware AV1 (NVIDIA RTX 40 / 50 and other GPUs with an AV1 Media Foundation encoder): about the HEVC quality at
; 2/3 of the bitrate, up to 8192 px wide. Above 1 Gpixel/s (8K at 72 / 90 fps) the encoder runs at its faster quality
; setting so it keeps up with VR frame rates. Without a hardware AV1 encoder the recording falls back to HEVC (logged).
; The tray's MKV / 8K / flat steps take AV1 recordings as they are (the MKV remux copies AV1; Matroska supports it).
codec = hevc

; Video bitrate in Mbit/s. 0 = default (120 for hevc, 80 for h264, 80 for av1). 1 Mbit/s = about 0.45 GB per hour:
; 120 = 54 GB/h, 150 = 68 GB/h, 200 = 90 GB/h, 250 = 113 GB/h, 300 = 135 GB/h. Suggested: 250 at 60 fps or more, 120 at 30 fps.
bitrate_mbps = 0

; Fallback frame rate when it cannot be measured from the game's frame timing.
fps = 90

; 0 = record every frame the game submits. Otherwise drop frames above this rate (e.g. 60).
max_fps = 0

; Resolution: the width of the whole side-by-side frame (both eyes together); the height follows the picture's shape.
; 0 = native resolution, exactly what the headset receives (capped at the codec limit: 8192 hevc / av1, 4096 h264).
; 3840 = 4K, 2560 = 2K, 1920 = 1080p (the Settings window's "Resolution" choices); any value 256..16384 works (rounded down to even).
; Smaller = less GPU work while recording (the symmetric_fov / head smoothing pass renders at this size, not at full size)
; and smaller files. VR180 / VR360 render at dome_width and are scaled down afterwards.
max_width = 0

; Record for YouTube: 1 = record straight in the YouTube layout, so the tray only remuxes the MP4 to .mkv (no re-encode,
; no quality loss, no long conversion). Both eyes get the symmetric_fov view (turned on for the recording even if
; symmetric_fov = 0), are centre-cropped to eye_crop, scaled so the frame's short side is 4320 (8K: 7680x4320 for
; tb_half + 16:9 or 4:3pad on a Quest 3; 4:3pad renders the black side bars too) and packed per layout_3d (tb_half = left
; eye on top, each eye half height) while recording;
; the MP4 gets the matching st3d box (top-bottom / left-right) and a <name>.json sidecar. Capped at the codec limit (8192;
; h264: 4096, so use hevc or av1 for 8K) and at max_width when it is set. What you lose: there is no full side-by-side
; source afterwards (crop, layout and size are baked in). Flat recordings only (VR180 / VR360 ignore it). For YouTube
; max_fps = 60 is a good match (YouTube plays at most 60 fps). 0 (default) = record side by side at native size and let
; the tray convert it.
record_for_youtube = 0

; gamma: auto (from the swapchain format), srgb or linear. Only change it if colours look washed out / too dark.
gamma = auto

[head_smoothing]
; 1 (default) = re-project both eyes to ONE common symmetric view (same field of view, parallel cameras), which is what
; 3D side-by-side players (YouTube VR, 3D TVs) expect. Headsets render each eye with an asymmetric field of view (the
; outer side is wider); played back raw on a flat 3D player, far objects land at different places in the two eyes and
; the eyes cannot fuse the picture (eye strain). The output keeps the part both eyes see (e.g. +-40 x +-45 degrees of a
; -50/+40 headset) at the game's pixel density, so it is a little narrower than the raw eye image.
; 0 = record the raw eye images exactly as the headset gets them (only useful for re-processing them yourself).
symmetric_fov = 1
; Head-motion smoothing ("stop head shaking"): the recording is re-projected onto a smoothed head orientation, the way
; a headset's timewarp re-projects a frame, so viewers do not get every small shake of your head. Rotation only.
; Applied to the recording only -- what you see in the headset is unchanged.
; 0 (default) = off: nothing extra runs, the output is exactly as without this feature.
; 0.1 .. 1 = strength. Filter time constant: 0.1 = 0.05 s, 0.3 = 0.11 s, 0.5 = 0.23 s, 0.6 = 0.33 s, 0.7 = 0.48 s,
; 0.8 = 0.70 s, 1.0 = 1.5 s  (= 0.05 s x 30 ^ ((value - 0.1) / 0.9)). Recommended 0.5 .. 0.7.
head_smoothing = 0.6
; Deliberate turns: once the smoothed view is this many degrees behind your head it catches up (full speed at twice
; this angle) and keeps following quickly until it is close again, so looking around is not lagged.
head_follow_deg = 12
; 1 = keep the horizon level (removes head roll / tilt from the recording). With edge_guard = 1 the horizon is only
; held level as far as the rendered image reaches (a few degrees); edge_guard = 0 holds it fully but shows black
; corners when you tilt your head.
roll_lock = 0
; The recording shows this fraction of the game's field of view (tan of each fov angle x this value), 0.5 .. 1.
; The trimmed border is the room the correction needs; 0.9 (default) leaves about 3 degrees on every side.
; Only used when head_smoothing > 0. Smaller = more room (stronger smoothing without hitting the edges), less view.
; With symmetric_fov = 1 it scales the common symmetric view.
output_fov_scale = 0.9
; 1 (default) = never show black edges: when a correction would need pixels the game did not render, the view follows
; the head just enough to stay inside the image. 0 = always apply the full correction (black edges can appear).
edge_guard = 1

[dome]
; VR180 / VR360 "dome" video instead of the flat side-by-side one (README: "VR180 / VR360 dome mode").
;   flat  = side-by-side 3D as before (default).
;   vr180 = two 180 x 180 degree half-spheres, left eye left / right eye right (YouTube VR180). Files *_VR180.mp4.
;   vr360 = two full 360 x 180 degree spheres, left eye on top / right eye below (YouTube 360 3D). Files *_VR360.mp4.
; The dome is a world-locked canvas: it faces where your head pointed when the recording started (horizon level), and
; every frame paints what each eye sees at the place it looked. Head shake disappears; looking around paints more of
; the dome; what you have not looked at for a while fades out. symmetric_fov and all [head_smoothing] settings are
; ignored in dome mode (swap_eyes still applies). Best for seated sims / cockpit games (ETS2 / ATS).
; EXPERIMENTAL: the dome only shows live video where your headset looked (about 100 degrees); the rest is older video or black.
projection = flat
; 3D layout of the files the tray makes from a FLAT recording (the .mkv and the YouTube 8K copy; left eye first, the
; Matroska 3D tag is written to match). The recording itself always stays full side by side. Only used with projection =
; flat (VR180 / VR360 have fixed layouts). Values:
;   tb_half (default) = top-bottom, half: frame = one eye's aspect, each eye squeezed to half height. YouTube's format.
;   sbs_half = side by side, half: frame = one eye's aspect, each eye squeezed to half width.
;   sbs_full = side by side, full: the recording as it is (each eye at its own aspect, frame = 2x eye aspect). YouTube
;              shows this stretched; for headset players / 3D TVs that read full side-by-side.
;   tb_full  = top-bottom, full: each eye at its own aspect, frame = eye aspect / 2.
; Anything but sbs_full makes the .mkv a RE-ENCODE at the recording's own size (slower than the plain copy; NVENC HEVC
; 150 Mbit/s, or slow x265 without NVENC). sbs_full keeps the fast no-re-encode remux. An unknown value logs a warning and
; uses tb_half. Read by the tray for every job.
layout_3d = tb_half
; Per-eye width in pixels. 0 (default) = the game's pixel density at the centre of the eye image, limited so the frame
; stays <= 8192 (vr180: <= 4096 per eye, frame 8192 x 4096; vr360: frame <= 8192 x 8192). The log shows what was chosen.
dome_width = 0
; start (default, the only value for now) = the dome faces your head's direction at the first frame of the recording.
dome_forward = start
; last_seen (default) = what you looked at earlier stays on the dome (until fill_fade_s); black = only the live view,
; everything else is black.
fill = last_seen
; Seconds an area stays after you last looked at it; then it fades to black over 2 s. 0 = never fade. Default 8.
fill_fade_s = 8
; Width in degrees of the soft edge where the live view blends into the older dome. 0 = hard edge. Default 1.
window_feather_deg = 1

[indicator]
; In-headset recording indicator: a small dot in the corner of your view, visible in the headset only (never in the
; video). Amber = starting / finishing, red pulsing = recording, green (1.5 s) = saved, red X (2 s) = failed; hidden
; otherwise. Direct3D 11 games (ETS2 / ATS) only for now. Read when the game starts its VR session.
vr_indicator = 1
; Position of the dot's centre in metres, relative to your head: x = right, y = up, z = forward (negative = in front).
indicator_x = 0.22
indicator_y = -0.16
indicator_z = -0.8
; Size of the dot in metres, 0.0005 .. 0.5 (0.02 m at 0.8 m is about 1.4 degrees; below ~0.001 it is smaller than a
; headset pixel and disappears) and its maximum opacity (0..1).
indicator_size = 0.02
indicator_opacity = 1.0

[audio]
; Records what plays on the audio device (WASAPI loopback) as AAC.
audio_enabled = 1
; Part of the playback device name, e.g. Virtual Desktop Audio. Empty = the default playback device.
audio_device =

[post_processing]
; Done by EyeCaptureTray.exe (not the game) after each recording finishes, while the tray is running. The tray re-reads
; these for every job, so no restart is needed.
; 1 (default) = write <same name>.mkv with the Matroska 3D tag (stereo_mode). YouTube only reliably recognises the 3D tag in the MKV, so
; upload the .mkv. With layout_3d = sbs_full it is a plain remux (no re-encode, left_right); with any other layout_3d (default
; tb_half) the picture is re-encoded to that layout at its own size and the frame rate is kept (see layout_3d). Needs ffmpeg
; (winget install Gyan.FFmpeg.Essentials).
; VR180 / VR360 recordings: always a plain remux (layout_3d does not apply); the MKV keeps the VR180 / 360 metadata (VR360 gets
; stereo_mode=top_bottom).
post_mkv = 1
; Crop each eye of a flat recording before the .mkv / 8K copy is made: 16:9 (default) | 4:3 | 4:3pad | none. Flat recordings often
; have eyes taller than wide (e.g. 4096x4630); a tall top/bottom video crashes the Quest YouTube player and YouTube caps it
; at 2160p (no 8K). 16:9 centre-crops each eye vertically (same cut for both, never stretched) so the 8K tb_half frame is
; 7680x4320; 4:3 gives 5760x4320 (likely YouTube's 4K tier); 4:3pad = the 4:3 crop, then black bars left and right up to
; 16:9 (nothing stretched): 7680x4320 with the 4:3 picture 5760 wide in the middle, the taller view AND the 8K tier; none
; keeps the full eye (tall video). An eye already wider than the choice is not cropped (4:3pad: not padded once it is 16:9
; or wider). With a crop, sbs_full is a re-encode too (only layout_3d = sbs_full + eye_crop = none is the plain remux).
; Unknown value: warning in the log, 16:9. Read by the tray for every job.
; File names: with 4:3, 4:3pad or none the re-encoded files get a tag (<name>_4x3.mkv / <name>_4x3pad.mkv / <name>_full.mkv,
; <name>_YT8K_4x3.mkv / <name>_YT8K_4x3pad.mkv / <name>_YT8K_full.mkv; a plain remux and _FLAT.mp4 are never tagged), so one
; recording converted with two crops keeps both files.
; An 8K file made by av1_nvenc (yt8k_codec = av1) also ends in _AV1: <name>_YT8K_AV1.mkv / <name>_YT8K_4x3_AV1.mkv / ...
; A conversion never overwrites a file: if the name exists it writes <name> (2).mkv, (3) ...
eye_crop = 16:9
; 0 (default) = delete the MP4 once the MKV is verified (a remux: it exists and is > 90% of the MP4's size; a re-encode: it exists, is
; not empty and its duration matches the MP4's within 1 s / 2%) and the flat / 8K files, if requested, were made.
; 1 = keep both. If the conversion fails the MP4 is never deleted.
keep_mp4 = 0
; 1 = also write <same name>_FLAT.mp4: a normal 2D video for viewers without a headset (left eye, 16:9 centre crop, scaled to
; 3840 wide, NVENC HEVC 40 Mbit/s or x264 crf 18 if there is no NVENC). Slower than the MKV step. Default 0 (off).
post_flat = 0
; 1 = also write <same name>_YT8K.mkv for YouTube, in the layout_3d layout (default half top-bottom, left eye on top).
; Each eye keeps its own aspect, the frame's short side is 4320 (long side capped at 8192); with tb_half each eye is squeezed
; to half height, so the frame has one eye's aspect. YouTube reads 3D
; uploads as half-format, so the picture is not stretched. YouTube shows a 4640 / 5804 wide side-by-side file in its 4K
; tier (1920 per eye, low bitrate); this keeps the 8K tier and about 3x the bitrate, so the 3D is much sharper in a
; headset. Upload the _YT8K.mkv (with eye_crop 4:3 / 4:3pad / none: _YT8K_4x3.mkv / _YT8K_4x3pad.mkv / _YT8K_full.mkv; made by
; AV1: <name>_YT8K[_4x3|_4x3pad|_full]_AV1.mkv).
; Re-encodes (NVENC with yt8k_codec at yt8k_bitrate_mbps, below; or slow x265 without NVENC), capped to 60 fps.
; Flat 3D recordings only (VR180 / VR360 are skipped). Default 0.
post_yt8k = 1
; Bitrate of the 8K copy in Mbit/s with NVENC (VBR; peak 4/3 of it, buffer 2x): 100, 150 (default) or 200 (20 - 400 allowed).
; The x265 fallback (no NVENC) uses constant quality (crf 18) and ignores it.
yt8k_bitrate_mbps = 150
; Encoder of the 8K copy: hevc (default, hevc_nvenc) or av1 (av1_nvenc, NVIDIA RTX 40 / 50; 8-bit 4:2:0 AV1 in the MKV,
; which YouTube accepts). Same yt8k_bitrate_mbps and VBR maths; AV1 needs less bitrate for the same quality
; (about 100 with av1 = 150 with hevc). Without AV1 NVENC it falls back to hevc_nvenc, then x265 (logged).
yt8k_codec = hevc
; When the conversion runs (it costs CPU / GPU, so during a game it can cost frame rate):
;   now         = right after each recording is saved.
;   session_end = once no OpenXR (VR) session is live; a conversion that is running when VR starts again is paused
;                 (ffmpeg suspended) and continues when VR stops.
;   game_exit   = (default) once the game that made the recording has exited and no VR game is running.
;   manual      = never on its own: recordings wait in the queue until you start them (Settings -> Conversions ->
;                 Start now, Settings / tray menu -> Convert a recording..., or tray menu -> Convert last recording now).
; Tray menu -> Convert last recording now / Convert a recording... always run at once. Read by the tray when config.ini changes.
post_when = game_exit
; Full path of ffmpeg.exe. Empty (default) = ffmpeg on PATH, else the WinGet packages folder
; (%LOCALAPPDATA%\Microsoft\WinGet\Packages), else an ffmpeg\ffmpeg.exe folder next to the tray app.
ffmpeg_path =

[debug]
; none | error | warn | info | debug. none = no logging at all (no lines in eye_capture.log or tray.log).
; Log: logs\eye_capture.log next to the DLL, copy in the output folder.
log_level = info
